name: Hourly Pyaterochka catalogue sync

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "camoufox[geoip]>=0.4"
          python -m camoufox fetch
      - name: Refresh full store catalogue
        env:
          PYATEROCHKA_STORE_ADDRESS: "Биробиджан, ул. Советская, д. 68 к. 1"
          PYATEROCHKA_MIN_INTERVAL: "0.8"
          CATALOG_PAGE_SIZE: "100"
        run: python sync_catalog.py
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalogue unchanged; no commit needed."
          else
            git commit -m "Refresh Pyaterochka store catalogue"
            git push
          fi
